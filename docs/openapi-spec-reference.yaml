openapi: 3.0.3
info:
  title: Restaurant Booking System API
  description: Production-grade agentic AI restaurant booking system with 8 core APIs
  version: 1.0.0
  contact:
    name: Restaurant Booking System
    email: support@restaurantbooking.com

servers:
  - url: https://966vlckuu6.execute-api.us-east-1.amazonaws.com/dev
    description: Development server

paths:
  /fetchRestaurantDetails:
    get:
      summary: Fetch all restaurant details
      description: Retrieves a list of all available restaurants with complete details
      operationId: fetchRestaurantDetails
      tags:
        - Restaurants
      responses:
        '200':
          description: Successfully retrieved restaurant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  body:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fetchRestaurantDetailsById:
    post:
      summary: Fetch restaurant details by ID
      description: Retrieves detailed information for a specific restaurant
      operationId: fetchRestaurantDetailsById
      tags:
        - Restaurants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
              properties:
                restaurantId:
                  type: string
                  description: Unique identifier for the restaurant
                  example: "rest_001"
      responses:
        '200':
          description: Successfully retrieved restaurant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  body:
                    $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tokenAmountCalculation:
    post:
      summary: Calculate booking amount with discounts
      description: Calculates total booking amount including discounts and taxes
      operationId: tokenAmountCalculation
      tags:
        - Pricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
                - numberOfGuests
                - bookingDate
                - bookingTime
              properties:
                restaurantId:
                  type: string
                  example: "rest_001"
                numberOfGuests:
                  type: integer
                  minimum: 1
                  maximum: 20
                  example: 4
                bookingDate:
                  type: string
                  format: date
                  example: "2024-01-15"
                bookingTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "19:30"
                discountCode:
                  type: string
                  example: "SAVE20"
      responses:
        '200':
          description: Successfully calculated booking amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  body:
                    $ref: '#/components/schemas/PricingCalculation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /registerUser:
    post:
      summary: Register a new user
      description: Creates a new user account with profile information
      operationId: registerUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - mobile
                - city
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: "john_doe"
                mobile:
                  type: string
                  pattern: "^\\+?[1-9]\\d{1,14}$"
                  example: "+1234567890"
                city:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "New York"
                preferences:
                  type: array
                  items:
                    type: string
                  example: ["Italian", "Mexican", "Asian"]
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  body:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "User registered successfully"
                      userId:
                        type: string
                        example: "user_12345"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /searchUserDetails:
    post:
      summary: Search user details
      description: Retrieves user profile information by username or user ID
      operationId: searchUserDetails
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "john_doe"
                userId:
                  type: string
                  example: "user_12345"
              oneOf:
                - required: ["username"]
                - required: ["userId"]
      responses:
        '200':
          description: Successfully retrieved user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  body:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bookATable:
    post:
      summary: Book a table with availability check
      description: Creates restaurant booking with availability validation
      operationId: bookATable
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
                - userId
                - bookingDate
                - bookingTime
                - numberOfGuests
              properties:
                restaurantId:
                  type: string
                  example: "rest_001"
                userId:
                  type: string
                  example: "user_12345"
                bookingDate:
                  type: string
                  format: date
                  example: "2024-01-15"
                bookingTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "19:30"
                numberOfGuests:
                  type: integer
                  minimum: 1
                  maximum: 20
                  example: 4
                specialRequests:
                  type: string
                  maxLength: 500
                  example: "Window seat preferred"
      responses:
        '201':
          description: Booking successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  body:
                    $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Time slot not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /paymentAPI:
    post:
      summary: Process payment for booking
      description: Processes payment for restaurant booking
      operationId: paymentAPI
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
                - amount
                - paymentMethod
              properties:
                bookingId:
                  type: string
                  example: "booking_67890"
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 150.00
                paymentMethod:
                  type: string
                  enum: ["credit_card", "debit_card", "paypal"]
                  example: "credit_card"
                cardDetails:
                  type: object
                  properties:
                    cardNumber:
                      type: string
                      pattern: "^[0-9]{16}$"
                      example: "4111111111111111"
                    expiryMonth:
                      type: integer
                      minimum: 1
                      maximum: 12
                      example: 12
                    expiryYear:
                      type: integer
                      minimum: 2024
                      example: 2025
                    cvv:
                      type: string
                      pattern: "^[0-9]{3,4}$"
                      example: "123"
      responses:
        '200':
          description: Payment successfully processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  body:
                    $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bookRestaurant:
    post:
      summary: Create basic restaurant booking
      description: Creates simple restaurant booking without availability validation
      operationId: bookRestaurant
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
                - userDetails
                - bookingDate
                - bookingTime
                - numberOfGuests
              properties:
                restaurantId:
                  type: string
                  example: "rest_001"
                userDetails:
                  type: object
                  required:
                    - name
                    - mobile
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 100
                      example: "John Doe"
                    mobile:
                      type: string
                      pattern: "^\\+?[1-9]\\d{1,14}$"
                      example: "+1234567890"
                    email:
                      type: string
                      format: email
                      example: "john.doe@email.com"
                bookingDate:
                  type: string
                  format: date
                  example: "2024-01-15"
                bookingTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "19:30"
                numberOfGuests:
                  type: integer
                  minimum: 1
                  maximum: 20
                  example: 4
      responses:
        '201':
          description: Booking successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  body:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Booking created successfully"
                      bookingId:
                        type: string
                        example: "booking_67890"
                      bookingReference:
                        type: string
                        example: "RB-2024-001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Restaurant:
      type: object
      required:
        - restaurantId
        - name
        - cuisine
        - location
        - rating
      properties:
        restaurantId:
          type: string
          example: "rest_001"
        name:
          type: string
          example: "The Golden Spoon"
        cuisine:
          type: string
          example: "Italian"
        location:
          type: string
          example: "Downtown"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.5
        priceRange:
          type: string
          enum: ["$", "$$", "$$$", "$$$$"]
          example: "$$"
        menu:
          type: array
          items:
            type: string
          example: ["Pasta", "Pizza", "Risotto"]
        description:
          type: string
          example: "Authentic Italian cuisine"

    User:
      type: object
      required:
        - userId
        - username
        - mobile
        - city
      properties:
        userId:
          type: string
          example: "user_12345"
        username:
          type: string
          example: "john_doe"
        mobile:
          type: string
          example: "+1234567890"
        city:
          type: string
          example: "New York"
        preferences:
          type: array
          items:
            type: string
          example: ["Italian", "Mexican"]

    Booking:
      type: object
      required:
        - bookingId
        - restaurantId
        - userId
        - bookingDate
        - bookingTime
        - numberOfGuests
        - status
      properties:
        bookingId:
          type: string
          example: "booking_67890"
        restaurantId:
          type: string
          example: "rest_001"
        userId:
          type: string
          example: "user_12345"
        bookingDate:
          type: string
          format: date
          example: "2024-01-15"
        bookingTime:
          type: string
          example: "19:30"
        numberOfGuests:
          type: integer
          example: 4
        status:
          type: string
          enum: ["confirmed", "pending", "cancelled"]
          example: "confirmed"
        specialRequests:
          type: string
          example: "Window seat preferred"
        bookingReference:
          type: string
          example: "RB-2024-001"

    Payment:
      type: object
      required:
        - paymentId
        - bookingId
        - amount
        - status
      properties:
        paymentId:
          type: string
          example: "pay_98765"
        bookingId:
          type: string
          example: "booking_67890"
        amount:
          type: number
          format: float
          example: 150.00
        status:
          type: string
          enum: ["completed", "pending", "failed"]
          example: "completed"
        paymentMethod:
          type: string
          example: "credit_card"
        transactionId:
          type: string
          example: "txn_abc123"

    PricingCalculation:
      type: object
      required:
        - baseAmount
        - totalAmount
        - currency
      properties:
        baseAmount:
          type: number
          format: float
          example: 200.00
        discountAmount:
          type: number
          format: float
          example: 40.00
        taxAmount:
          type: number
          format: float
          example: 16.00
        totalAmount:
          type: number
          format: float
          example: 176.00
        currency:
          type: string
          example: "USD"
        discountCode:
          type: string
          example: "SAVE20"

    Error:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Invalid input parameters"
        statusCode:
          type: integer
          example: 400

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Restaurants
    description: Restaurant discovery and information APIs
  - name: Users
    description: User management and profile APIs
  - name: Bookings
    description: Restaurant booking and reservation APIs
  - name: Payments
    description: Payment processing APIs
  - name: Pricing
    description: Pricing calculation APIs